openapi: 3.1.0
info:
  title: Acme Customer Portal — Password Reset
  version: "1.0"
  description: >
    Contract for self-service password reset. Design output from Lab 3.
    Reuses the central Auth service (ADR-001). Token policy per ADR-007.
paths:
  /password-reset:
    post:
      summary: Request a password-reset link
      description: >
        Always returns 202 with the SAME body whether or not the email maps to an
        account — the response must never reveal whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Request accepted (identical for known and unknown emails).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
        "429":
          description: Too many requests (rate limited). Threshold = TBC with Security.
  /password-reset/confirm:
    post:
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string }
      responses:
        "200": { description: Password updated; token is now consumed. }
        "400": { description: Token expired, already used, or invalid. }
