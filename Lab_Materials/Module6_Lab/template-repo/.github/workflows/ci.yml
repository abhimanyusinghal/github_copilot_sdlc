# Acme Customer Portal — CI/CD  (BROKEN ON PURPOSE — this is the Lab 6 starting point)
#
# On its first run this workflow GOES RED. That is expected: it has real, seeded
# problems for you to find and fix in VS Code.
# Diagnose it with your BYOK model in VS Code Copilot Chat — do NOT use Copilot on github.com.

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m pytest -q # this fails: dependencies were never installed

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Deploy to production
        run: bash scripts/deploy.sh --target prod --traffic 100
        env:
          DEPLOY_TOKEN: "lab-token-committed-in-plain-text"
